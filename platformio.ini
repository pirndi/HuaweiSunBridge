; HuaweiSunBridge - WT32-ETH01 TCP-Bridge fuer Huawei SUN2000 WR-AP
;
; Plattform bewusst gepinnt: Arduino-Core 2.x. Core 3.x aendert die
; Signatur von ETH.begin(); der Code faengt beides ab (siehe net.cpp),
; getestet ist aber diese Kombination.

[env:wt32-eth01]
platform = espressif32@6.9.0
board = wt32-eth01
framework = arduino

monitor_speed = 115200
upload_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DFW_VERSION=\"0.1.0\"

lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    ESP32Async/AsyncTCP@^3.2.0
    ESP32Async/ESPAsyncWebServer@^3.6.0
