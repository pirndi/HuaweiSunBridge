name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: PlatformIO installieren
        run: pip install platformio

      - name: Firmware bauen
        run: pio run -e wt32-eth01

      - name: Firmware umbenennen
        run: |
          TAG=${GITHUB_REF_NAME:-dev}
          cp .pio/build/wt32-eth01/firmware.bin HuaweiSunBridge-${TAG}-wt32-eth01.bin

      - name: GitHub Release anlegen
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: HuaweiSunBridge-*.bin
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Firmware als Artefakt speichern (kein Tag)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: firmware-dev
          path: HuaweiSunBridge-*.bin
